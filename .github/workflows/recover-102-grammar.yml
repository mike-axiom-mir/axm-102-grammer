name: Recover AXM 102 Grammar Body

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-102-grammar.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact donor checkpoint
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-collaboration-platform
          ref: 386736aaae3993089dfaf970cf2360894959e3c0
          path: donor
          persist-credentials: false

      - name: Copy actual 102-language source bytes
        shell: bash
        run: |
          set -euo pipefail
          SRC='donor/shared/code-capability-fabric/language-organs'
          DST='language-organs'
          rm -rf "$DST"
          mkdir -p "$DST"

          # All 102 language packages. Each package carries the organ contract,
          # grammar profile, specialist eye, machine template bank, machine
          # keyboard bank, and machine cheatcode bank as actual files.
          cp -a "$SRC/organs" "$DST/organs"

          # Shared source-of-truth and deterministic generators/registries.
          for f in \
            families.json \
            organ.schema.json \
            provenance.json \
            registry.js \
            grammar-profile-registry.js \
            build-grammar-profiles.py \
            selftest-grammar-profiles.js \
            selftest.js \
            selftest-adversarial.js \
            human-developer-perspective.json \
            build-specialist-eyes.py \
            specialist-eye-registry.js \
            code-native-discovery-seam.js \
            selftest-specialist-eyes.js \
            build-machine-templates.js \
            machine-template-fabric.js \
            template-fast-router.js \
            template-pattern-miner.js \
            template-fabric.contract.json \
            selftest-machine-templates.js \
            build-machine-cheatcodes.js \
            machine-cheatcode-fabric.js \
            machine-cheatcode-influence-mesh.js \
            selftest-machine-cheatcodes.js \
            selftest-machine-cheatcode-influence.js \
            build-machine-keyboards.js \
            machine-code-keyboard-fabric.js \
            machine-code-keyboard-router.js \
            machine-code-keyboard.contract.json
          do
            cp "$SRC/$f" "$DST/$f"
          done

          cp "$SRC/README.md" "$DST/SOURCE_README.md"

      - name: Verify standalone recovered body
        shell: bash
        run: |
          set -euo pipefail
          test "$(find language-organs/organs -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 102
          test "$(find language-organs/organs -mindepth 2 -maxdepth 2 -type f | wc -l)" -eq 612

          python language-organs/build-grammar-profiles.py --check
          node language-organs/selftest-grammar-profiles.js
          python language-organs/build-specialist-eyes.py --check
          node language-organs/selftest-specialist-eyes.js
          node language-organs/selftest.js
          node language-organs/selftest-adversarial.js
          node language-organs/build-machine-templates.js --check
          node language-organs/selftest-machine-templates.js
          node language-organs/build-machine-cheatcodes.js --check
          node language-organs/selftest-machine-cheatcodes.js
          node language-organs/selftest-machine-cheatcode-influence.js
          node language-organs/build-machine-keyboards.js --check
          node - <<'NODE'
          const keyboard=require('./language-organs/machine-code-keyboard-fabric.js');
          const router=require('./language-organs/machine-code-keyboard-router.js');
          const snapshot=keyboard.snapshot();
          if(snapshot.bankCount!==102) throw new Error(`KEYBOARD_BANK_COUNT_NOT_102:${snapshot.bankCount}`);
          if(snapshot.keysPerBank!==48) throw new Error(`KEYS_PER_BANK_NOT_48:${snapshot.keysPerBank}`);
          if(snapshot.totalStableKeyCount!==4896) throw new Error(`STABLE_KEY_COUNT_NOT_4896:${snapshot.totalStableKeyCount}`);
          if(new Set(snapshot.banks.map(x=>x.keyboardSha256)).size!==102) throw new Error('KEYBOARD_DIGESTS_NOT_UNIQUE');
          if(typeof router.layout!=='function'||typeof router.press!=='function') throw new Error('KEYBOARD_ROUTER_EXPORTS_MISSING');
          console.log(JSON.stringify({ok:true,bankCount:snapshot.bankCount,keysPerBank:snapshot.keysPerBank,totalStableKeyCount:snapshot.totalStableKeyCount,uniqueKeyboardDigests:102,routerExports:['layout','press']},null,2));
          NODE

      - name: Write recovery receipt and standalone README
        shell: bash
        run: |
          set -euo pipefail
          cat > RECOVERY_RECEIPT.md <<'EOF'
          # AXM 102 Grammar Recovery Receipt

          Recovered from the exact source checkpoint below as actual repository files.

          - donor repository: `mike-axiom-mir/axm-collaboration-platform`
          - donor branch: `codex/code-creation-fabric-102-grammar-integration-v2.12`
          - donor commit: `386736aaae3993089dfaf970cf2360894959e3c0`
          - donor PR: `#62`
          - recovered language directories: `102`
          - recovered per-language files: `612`
          - per-language layers: organ, grammar profile, specialist eye, machine templates, machine keyboard, machine cheatcodes
          - Grammar Glass / Code Twister: deliberately excluded
          - integration-only keyboard test importing `code-prebuild-twin.js`: deliberately excluded; the standalone keyboard bank and router surface are verified directly instead

          The focused deterministic grammar/language tests were rerun inside this standalone repository before this receipt was committed.

          This repository contains source bytes. It is not a submodule, symlink, clone script, or source pointer.
          EOF

          cat > README.md <<'EOF'
          # AXM 102 Grammar Body

          Status: **RECOVERED STANDALONE TEST BODY**

          This is the clean standalone home for the AXM 102 code/language grammar body.

          It contains the actual recovered source and generated language-specific materializations for all 102 code/language organs, including grammar-native profiles, specialist eyes, machine template banks, machine keyboard banks, and machine cheatcode banks, together with their focused deterministic generators, registries, and checks.

          ## Recovery checkpoint

          - source repository: `mike-axiom-mir/axm-collaboration-platform`
          - source branch: `codex/code-creation-fabric-102-grammar-integration-v2.12`
          - source commit: `386736aaae3993089dfaf970cf2360894959e3c0`
          - source PR: `#62`

          ## Deliberate boundary

          Grammar Glass / Code Twister is **not** in this repository. It is a separate layer and can develop independently against this 102-grammar body.

          The wider Creation Fabric session planner is also not copied here because it imports Work Context, Production Draft, Build Window, admission, and other platform layers. This repository keeps the 102-language body itself clean instead of smuggling the wider platform back in.

          See `RECOVERY_RECEIPT.md` for the exact recovery receipt and `language-organs/SOURCE_README.md` for the source package's original technical description.
          EOF

      - name: Commit recovered source into clean repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf donor
          git config user.name 'AXM Recovery Courier'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md RECOVERY_RECEIPT.md language-organs
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git commit -m 'Recover standalone AXM 102 grammar source body'
          git push origin HEAD:main
