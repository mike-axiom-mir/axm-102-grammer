name: Publish 2026-09-13 public checkpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-checkpoint-release-20260913.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate prerelease checkpoint from main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: public-checkpoint-2026-09-13
          STAGE: "Recovered standalone 102-Grammar test body and bounded capability surface."
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          repo_name="${GITHUB_REPOSITORY#*/}"
          cat > release-notes.md <<EOF
          Public experimental checkpoint of ${repo_name}.

          Current public stage: ${STAGE}

          This prerelease records the exact repository state at the tagged commit. It is a source checkpoint, not a claim of production readiness, CANON status, universal validity, or completion beyond the repository's documented evidence boundary.

          AXM-owned source is licensed under Apache-2.0. Third-party material, where present, retains its own upstream terms and notices.

          Read README.md and the repository's verification/evidence files for the detailed current stage, known limits, and starting path.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${repo_name} — Public Checkpoint 2026-09-13" --notes-file release-notes.md --prerelease
